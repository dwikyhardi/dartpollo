name: dartpollo_generator
version: 0.1.0-alpha.6

description: Code generator for the dartpollo GraphQL client. Builds Dart types from GraphQL schemas and queries.
repository: https://github.com/dwikyhardi/dartpollo
issue_tracker: https://github.com/dwikyhardi/dartpollo/issues
homepage: https://github.com/dwikyhardi/dartpollo

topics:
  - graphql
  - codegen
  - build-runner

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  build: ^4.0.6
  code_builder: ^4.11.1
  collection: ^1.19.1
  crypto: ^3.0.7
  dart_style: ^3.1.7
  dartpollo_annotation: ^0.1.0-alpha.3
  equatable: ^2.0.8
  glob: ^2.1.3
  gql: ^1.0.1
  gql_code_builder: ^0.13.4
  json_annotation: ^4.12.0
  path: ^1.9.1
  pub_semver: ^2.2.0
  recase: ^4.1.0
  source_gen: ^4.2.3

dev_dependencies:
  build_test: ^3.5.15
  logging: ^1.3.0
  pedantic_mono: ^1.35.0
  test: ^1.31.1
