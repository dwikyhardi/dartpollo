name: pokemon_example
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  dartpollo:
    path: ../../
  equatable: ^2.0.8
  gql: ^1.0.1
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner:
  dartpollo_generator:
    path: ../../../dartpollo_generator
  json_serializable:

# Checkout packages reference unreleased annotation versions.
dependency_overrides:
  dartpollo_annotation:
    path: ../../../dartpollo_annotation
