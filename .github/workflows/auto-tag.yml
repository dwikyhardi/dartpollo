name: Auto Tag Release

# After main's CI succeeds, when a package's pubspec version changes,
# validate it with a dry-run publish and, if it passes, create & push the
# matching release tag. That tag push triggers the per-package publish-*
# workflow (keyless OIDC publishing to pub.dev).
#
# Flow:
#   detect version change -> dart pub publish --dry-run
#       -> pass -> create tag -> publish-<package> workflow triggered
#       -> fail -> job fails
#
# A release credential is required: GITHUB_TOKEN tag pushes cannot trigger publishing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history verifies main ancestry and finds existing release tags.
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          token: ${{ secrets.RELEASE_PAT }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.1

      - uses: bluefireteam/melos-action@v3

      - name: Detect version changes, dry-run and tag
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge-base --is-ancestor HEAD origin/main

          packages="dartpollo_annotation dartpollo_generator dartpollo"

          read_version() {
            # $1 = pubspec content on stdin source already captured
            grep -E '^version:' | head -n1 | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]*$//'
          }

          tagged_any=false

          for pkg in $packages; do
            file="packages/$pkg/pubspec.yaml"

            current="$(read_version < "$file")"

            tag="$pkg-v$current"
            echo "::notice::$pkg: checking release $current (tag: $tag)"

            if curl --fail --silent "https://pub.dev/api/packages/$pkg/versions/$current" > /dev/null; then
              echo "::notice::$pkg $current is already published - skipping."
              continue
            fi

            echo "::group::Dry-run publish for $pkg"
            ( cd "packages/$pkg" && dart pub publish --dry-run )
            echo "::endgroup::"

            echo "Dry-run passed - creating and pushing tag $tag"
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              git tag "$tag"
              git push origin "refs/tags/$tag"
            else
              test "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)"
            fi
            tagged_any=true

            # Publish shared annotations before validating dependent packages.
            published=false
            for attempt in $(seq 1 90); do
              echo "Waiting for $pkg $current on pub.dev (attempt $attempt/90)"
              if curl --fail --silent --show-error "https://pub.dev/api/packages/$pkg/versions/$current" > /dev/null; then
                published=true
                break
              fi
              sleep 10
            done
            if [ "$published" != "true" ]; then
              echo "::error::$pkg $current was not published within 15 minutes. Check its publish workflow."
              exit 1
            fi
          done

          if [ "$tagged_any" = "false" ]; then
            echo "::notice::No new package versions to tag."
          fi
