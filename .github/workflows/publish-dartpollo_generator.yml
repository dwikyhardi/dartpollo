name: Publish dartpollo_generator

# Tag-triggered, keyless (OIDC) publishing for the `dartpollo_generator`
# package. The tag is created automatically by `auto-tag.yml` when the
# package version changes (pub.dev tag-pattern: dartpollo_generator-v{{version}}).
on:
  push:
    tags:
      # Stable releases, e.g. dartpollo_generator-v1.2.3
      - 'dartpollo_generator-v[0-9]+.[0-9]+.[0-9]+'
      # Pre-releases, e.g. dartpollo_generator-v0.1.0-alpha.3
      - 'dartpollo_generator-v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  publish:
    permissions:
      id-token: write # Required for OIDC authentication with pub.dev.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/dartpollo_generator
