name: Publish dartpollo

# Tag-triggered, keyless (OIDC) publishing for the `dartpollo` package.
# The tag is created automatically by `auto-tag.yml` when the package
# version changes (pub.dev tag-pattern: dartpollo-v{{version}}).
on:
  push:
    tags:
      # Stable releases, e.g. dartpollo-v1.2.3
      - 'dartpollo-v[0-9]+.[0-9]+.[0-9]+'
      # Pre-releases, e.g. dartpollo-v0.1.0-alpha.3
      - 'dartpollo-v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  publish:
    permissions:
      id-token: write # Required for OIDC authentication with pub.dev.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/dartpollo
